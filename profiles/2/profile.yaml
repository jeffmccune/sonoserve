# Profile 2 - Rylo
#
# Served at /profiles/2. The CardPuter stores only the profile number and
# fetches this profile from the server at startup, so changes here take effect
# by deploying a new server, without reprogramming the device.

# Name shown on the CardPuter ready screen.
name: Rylo

# Sonos speaker this profile controls. A speaker saved in the device settings
# takes precedence. Empty uses the server -default-speaker.
speaker: Rylos Room

# Profile image: a file in this folder, or an http(s) URL such as a GitHub
# avatar, e.g. https://github.com/<user>.png. The server fetches, scales, and
# re-encodes the image as a baseline JPEG for the CardPuter, falling back to
# avatar.jpg in this folder if the URL cannot be fetched.
image: avatar.jpg

# Accent color of the ready screen, #RRGGBB.
color: "#E65A28"

# Volume a preset starts at, never above the limit. 0 uses the server
# -day-preset-volume and -night-preset-volume percent of the limit. Device
# settings take precedence when not 0.
default_volume: 0

# Maximum volume, 0 for no limit beyond the server time of day schedule. The
# lower of this and the schedule applies. Device settings take precedence when
# not 0.
max_volume: 30

# Lines shown on the ready screen below the name.
help:
  - 0-9 a-z  Music
  - "[ ]  Pause / Play"
  - ", /  Back / Next"
  - "; .  Louder / Quieter"

# Key actions override the defaults: 0-9 and a-z play the preset of the same
# name, [ pause, ] play, , previous, / next, ; volume-up, . volume-down.
# Actions: preset:<name>, play, pause, play-pause, next, previous, volume-up,
# volume-down, mute, none.
keys: {}
